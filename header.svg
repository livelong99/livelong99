<svg viewBox="0 0 1200 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vaibhav Chaudhary — AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D16"/>
      <stop offset="0.55" stop-color="#0E1020"/>
      <stop offset="1" stop-color="#0A0C18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36D1FF"/>
      <stop offset="0.5" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#FF5FA2"/>
    </linearGradient>
    <radialGradient id="blobV" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.55"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#36D1FF" stop-opacity="0.5"/><stop offset="1" stop-color="#36D1FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobM" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF5FA2" stop-opacity="0.45"/><stop offset="1" stop-color="#FF5FA2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFDF6"/><stop offset="0.5" stop-color="#FFF1DC"/><stop offset="1" stop-color="#FFB9D6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- aurora depth -->
  <g filter="url(#soft)">
    <circle cx="980" cy="110" r="150" fill="url(#blobV)"/>
    <circle cx="1130" cy="230" r="150" fill="url(#blobC)"/>
    <circle cx="850" cy="255" r="120" fill="url(#blobM)"/>
    <circle cx="110" cy="30" r="130" fill="url(#blobV)" opacity="0.45"/>
  </g>

  <!-- thin top rim light -->
  <rect x="0" y="0" width="1200" height="2.5" fill="url(#accent)" opacity="0.55"/>

  <!-- infinity-ribbon signature (ties to Eona OS) -->
  <g transform="translate(852,72) scale(1.5)">
    <path filter="url(#glow)" opacity="0.6" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round"
      d="M60,90 C60,50 105,50 105,90 C105,130 150,130 150,90 C150,50 105,50 105,90 C105,130 60,130 60,90 Z"/>
    <path fill="none" stroke="url(#accent)" stroke-width="15" stroke-linecap="round"
      d="M60,90 C60,50 105,50 105,90 C105,130 150,130 150,90 C150,50 105,50 105,90 C105,130 60,130 60,90 Z"/>
    <circle cx="105" cy="90" r="11" fill="url(#core)"/>
    <circle cx="105" cy="90" r="5" fill="#FFFDF6"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="90" y="150" font-size="60" font-weight="700" fill="#F2F3F8" letter-spacing="1.2">Vaibhav Chaudhary</text>
    <text x="92" y="196" font-size="23" font-weight="600" fill="url(#accent)" letter-spacing="7">AI ENGINEER</text>
    <text x="92" y="233" font-size="16.5" font-weight="400" fill="#8A8FA6">Building AI-driven products — agents, games, wearables &amp; the systems behind them.</text>
    <g transform="translate(92,255)">
      <circle cx="6" cy="9" r="4" fill="#36D1FF"/>
      <text x="18" y="13" font-size="13.5" font-weight="500" fill="#A9AEC4">Open to freelance &amp; collaboration</text>
    </g>
  </g>
</svg>
